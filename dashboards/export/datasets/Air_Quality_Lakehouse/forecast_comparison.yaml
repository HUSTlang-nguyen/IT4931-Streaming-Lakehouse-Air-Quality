table_name: forecast_comparison
main_dttm_col: target_time
description: null
default_endpoint: null
offset: 0
cache_timeout: null
catalog: iceberg
schema: live
sql: "SELECT h.sensor_id,h.station_name,h.period_end AS target_time,\n        format_datetime(h.period_end\
  \ AT TIME ZONE 'UTC' AT TIME ZONE 'Asia/Ho_Chi_Minh',\n        'yyyy-MM-dd HH:mm')\
  \ AS local_time,u.curve,u.chart_value\n        FROM iceberg.live.hourly h LEFT JOIN\
  \ iceberg.live.forecast_actual f\n          ON h.sensor_id=f.sensor_id AND h.period_end=f.target_time\
  \ AND f.mode='backtest'\n          AND f.issued_at=(SELECT max(issued_at) FROM iceberg.live.forecast_actual\
  \ WHERE mode='backtest')\n        CROSS JOIN UNNEST(ARRAY['Th\u1EF1c t\u1EBF','Random\
  \ Forest','Persistence'],\n          ARRAY[h.value,f.predicted_value,f.baseline_value])\
  \ AS u(curve,chart_value)\n        WHERE h.parameter_name='pm25'"
