# Tất cả resources thuộc project riêng; stop không xóa volumes.
name: air-quality-lakehouse

services:
  kafka:
    image: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    ports: ["127.0.0.1:19092:19092"]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 2
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 720
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: ["kafka_data:/var/lib/kafka/data"]
    mem_limit: 900m
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  minio:
    image: air-quality-minio:2025-10-15
    build:
      context: ..
      dockerfile: infra/minio/Dockerfile
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run air-quality start to prepare local credentials}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run air-quality start to prepare local credentials}
      MINIO_BROWSER: "on"
    volumes: ["minio_data:/data"]
    mem_limit: 600m
    restart: unless-stopped

  # Image catalog chạy UID1000. Named volume mới có owner root; init riêng
  # chỉ sửa owner thư mục project này, không xóa DB hay chạy server root.
  catalog-init:
    image: python:3.11.13-slim-bookworm@sha256:86adf8dbadc3d6e82ee5dd2c74bec2e1c2467cdad47886280501df722372d2e1
    volumes: ["catalog_data:/catalog"]
    command: ["python", "-c", "import os; os.chown('/catalog', 1000, 1000)"]
    mem_limit: 128m

  catalog:
    image: tabulario/iceberg-rest:1.6.0@sha256:3b7d31bdfec626b68e97531c9778a1b9119659e456fe28545a49f6aa6a9ce472
    ports: ["127.0.0.1:18181:8181"]
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      # WAL cho dashboard đọc đồng thời Spark commit; busy timeout hữu hạn.
      CATALOG_URI: "jdbc:sqlite:/catalog/catalog.db?journal_mode=WAL&busy_timeout=30000"
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m
    volumes: ["catalog_data:/catalog"]
    depends_on:
      minio: {condition: service_healthy}
      catalog-init: {condition: service_completed_successfully}
    mem_limit: 600m
    restart: unless-stopped

  postgres:
    image: postgres:16.9-bookworm@sha256:253815cf7579ffa05e1673d92e78d37273e61be0e4414e9a1449337d7925be94
    environment:
      POSTGRES_USER: superset
      POSTGRES_DB: superset
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run air-quality start}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 10s
      timeout: 5s
      retries: 15
    mem_limit: 300m
    restart: unless-stopped

  trino:
    image: trinodb/trino:476@sha256:00125e40d063bc4816d165482f6044872b18b56026fb959d3b28ce1f96ffbbee
    ports: ["127.0.0.1:18080:8080"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./trino/config.properties:/etc/trino/config.properties:ro
      - ./trino/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/catalog:/etc/trino/catalog:ro
    depends_on: [catalog]
    mem_limit: 1600m
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  superset:
    image: air-quality-superset:4.1.2
    build:
      context: ..
      dockerfile: infra/superset/Dockerfile
    ports: ["127.0.0.1:18088:8088"]
    environment:
      SUPERSET_CONFIG_PATH: /app/config/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?Run air-quality start}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?Run air-quality start}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 1300m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 25
      start_period: 30s
    restart: unless-stopped

  # Spark là job thực, không có daemon/master giả chỉ để xanh healthcheck.
  # Chạy bằng docker compose run --rm spark python -m air_quality.processing.jobs ...
  spark: &spark-runtime
    image: air-quality-runtime:3.5.6
    build:
      context: ..
      dockerfile: infra/spark/Dockerfile
    profiles: [jobs]
    environment:
      PYTHONPATH: /app/src
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ICEBERG_CATALOG_URI: http://catalog:8181
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      SPARK_LOCAL_IP: 127.0.0.1
      AIR_QUALITY_CODE_REVISION: ${AIR_QUALITY_CODE_REVISION:-unknown}
      AIR_QUALITY_CODE_DIRTY: ${AIR_QUALITY_CODE_DIRTY:-unknown}
    volumes:
      - ../src:/app/src:ro
      - ../sql:/app/sql:ro
      - ../tests:/app/tests:ro
      - ../data:/app/data
      - ../checkpoints:/app/checkpoints
      - ../artifacts:/app/artifacts
      - model_data:/app/models
    working_dir: /app
    mem_limit: 2800m
    cpus: 2
    command: ["python", "-m", "air_quality.processing.jobs", "smoke"]

  processor:
    <<: *spark-runtime
    profiles: [pipeline]
    command: ["python", "-m", "air_quality.processing.jobs", "ingest", "--continuous"]
    depends_on:
      kafka: {condition: service_healthy}
      minio: {condition: service_healthy}
      catalog: {condition: service_started}
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time; from pathlib import Path; p=Path('/app/artifacts/local/processor-heartbeat.json'); assert p.exists() and time.time()-p.stat().st_mtime<120 and json.loads(p.read_text())['query_active']"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 4

  collector:
    image: air-quality-runtime:3.5.6
    profiles: [pipeline]
    working_dir: /app
    environment:
      PYTHONPATH: /app/src
      OPENAQ_API_KEY: ${OPENAQ_API_KEY:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AIR_QUALITY_INGEST_MODE: live
      AIR_QUALITY_TOPIC: air-quality.live
      AIR_QUALITY_STATE_DIR: /app/collector-state
      AIR_QUALITY_DATA_DIR: /app/data
      AIR_QUALITY_POLL_INTERVAL_SECONDS: ${AIR_QUALITY_POLL_INTERVAL_SECONDS:-300}
      AIR_QUALITY_OVERLAP_HOURS: ${AIR_QUALITY_OVERLAP_HOURS:-24}
      AIR_QUALITY_RECONCILE_DAYS: ${AIR_QUALITY_RECONCILE_DAYS:-7}
      AIR_QUALITY_RECONCILE_INTERVAL_HOURS: ${AIR_QUALITY_RECONCILE_INTERVAL_HOURS:-24}
      OPENAQ_REQUEST_INTERVAL_SECONDS: ${OPENAQ_REQUEST_INTERVAL_SECONDS:-2.1}
      OPENAQ_HOURLY_REQUEST_LIMIT: ${OPENAQ_HOURLY_REQUEST_LIMIT:-1800}
      OPENAQ_PAGE_SIZE: ${OPENAQ_PAGE_SIZE:-1000}
    volumes:
      - ../src:/app/src:ro
      - ../data:/app/data
      - collector_state:/app/collector-state
    command: ["python", "-m", "air_quality.cli", "live"]
    depends_on:
      kafka: {condition: service_healthy}
    mem_limit: 450m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import time; from pathlib import Path; p=Path('/app/data/reports/live-latest.json'); assert p.exists() and time.time()-p.stat().st_mtime<900"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 4

volumes:
  kafka_data:
  minio_data:
  catalog_data:
  postgres_data:
  model_data:
  collector_state:
